name: Daily macro data refresh
# Refreshes macro_data.json from official free public sources (BLS, SingStat, US Treasury).
# One small public-data file; no keys, holdings or personal data. ~1-2 minutes per run.
# Actions usage is free for public repositories on standard GitHub-hosted runners.
on:
  schedule:
    - cron: '30 23 * * *'  # 07:30 Asia/Singapore daily
  workflow_dispatch:        # manual run from the Actions tab when needed

permissions:
  contents: write           # only so the job can commit the refreshed data file

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh macro data
        run: python macro_update.py macro_data.json
      - name: Commit only if the data changed
        run: |
          if [ ! -f macro_data.json ]; then
            echo "No data file produced; failing visibly."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro_data.json
          if git diff --cached --quiet -- macro_data.json; then
            echo "No change in macro data; nothing to commit."
            exit 0
          fi
          git commit -m "Macro data refresh $(date -u +%Y-%m-%d)"
          git push
